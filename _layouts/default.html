<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05070d" />
  <title>{{ page.title }}</title>

  <!-- Tipografies del tema (també estan al CSS amb @import; aquí es carreguen abans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="{{ '/assetscss/custom.css' | relative_url }}">
</head>
<body>

  <!-- Botó de "Tornar a l'inici" (pàgina principal) -->
  <button onclick="window.location.href='https://pauserra-ie.github.io/ASO/'" id="goToHomeBtn" title="Tornar a l'inici" aria-label="Tornar a l'inici">
    🏠
  </button>

  <!-- Contingut de la pàgina -->
  <main>
    <h1 data-text="{{ page.title | escape }}">{{ page.title }}<span class="cursor" aria-hidden="true">_</span></h1>
    {{ content }}
  </main>

  <!-- Botons a la part inferior dreta -->
  <div id="scrollButtons">
    <button onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" id="scrollUpBtn" title="Pujar" aria-label="Pujar">
      ↑
    </button>
    <button onclick="window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' })" id="scrollDownBtn" title="Baixar" aria-label="Baixar">
      ↓
    </button>
  </div>

  <!-- Peu de pàgina amb llicència -->
  <footer class="license">
    <a href="https://pauserra-ie.github.io/ASO/">ASO</a> © 2026 by
    <a href="https://github.com/pauserra-IE">Lluc Sarra Masdeu</a>
    is licensed under
    <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>
    <img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="CC" class="license-icon">
    <img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="BY" class="license-icon">
    <img src="https://mirrors.creativecommons.org/presskit/icons/nc.svg" alt="NC" class="license-icon">
    <img src="https://mirrors.creativecommons.org/presskit/icons/sa.svg" alt="SA" class="license-icon">
  </footer>

</body>
</html>
